<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Affine Cipher</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:30px auto;padding:0 16px;background:#f4f6fa;color:#222}
  h1{margin-bottom:4px} .card{background:#fff;padding:18px;border-radius:10px;margin:14px 0;box-shadow:0 1px 4px #0002}
  label{font-weight:600;margin-right:6px} select,input[type=number]{padding:6px;margin-right:16px}
  textarea{width:100%;height:110px;padding:8px;box-sizing:border-box;font-family:monospace}
  button{padding:8px 18px;margin:8px 8px 0 0;border:0;border-radius:6px;background:#2f5bea;color:#fff;cursor:pointer}
  button.alt{background:#1a8f5a} .err{color:#c0392b;font-weight:600;min-height:20px}
  h3{margin:14px 0 6px}
</style>
</head>
<body>
<h1>Affine Cipher</h1>
<p>C = (a·P + b) mod 26 &nbsp;|&nbsp; P = a⁻¹·(C − b) mod 26</p>

<div class="card">
  <label>Kunci a</label>
  <select id="a">{% for v in valid_a %}<option value="{{v}}">{{v}}</option>{% endfor %}</select>
  <label>Kunci b</label>
  <input type="number" id="b" min="0" max="25" value="0">
  <div class="err" id="err"></div>
</div>

<div class="card">
  <h3>Teks</h3>
  <textarea id="text" placeholder="Ketik teks di sini..."></textarea>
  <button onclick="doText('encrypt')">Enkripsi</button>
  <button class="alt" onclick="doText('decrypt')">Dekripsi</button>
  <h3>Hasil (asli)</h3><textarea id="r_full" readonly></textarea>
  <h3>Format tanpa spasi</h3><textarea id="r_nospace" readonly></textarea>
  <h3>Format kelompok 5 huruf</h3><textarea id="r_groups" readonly></textarea>
</div>

<div class="card">
  <h3>File (teks / biner: jpg, docx, mp3, mp4, dll)</h3>
  <input type="file" id="file"><br>
  <button onclick="doFile('encrypt')">Enkripsi File</button>
  <button class="alt" onclick="doFile('decrypt')">Dekripsi File</button>
  <p style="font-size:13px">Enkripsi menghasilkan <code>.dat</code>. Dekripsi mengembalikan ekstensi asli otomatis.</p>
</div>

<script>
const err = m => document.getElementById('err').textContent = m || '';
const $ = id => document.getElementById(id);

function keyForm(mode){
  const fd = new FormData();
  fd.append('a', $('a').value); fd.append('b', $('b').value); fd.append('mode', mode);
  return fd;
}

async function doText(mode){
  err('');
  const fd = keyForm(mode); fd.append('text', $('text').value);
  const res = await fetch('/api/text', {method:'POST', body:fd});
  const j = await res.json();
  if(!j.ok){ err(j.error); return; }
  $('r_full').value = j.result; $('r_nospace').value = j.no_space; $('r_groups').value = j.groups;
}

async function doFile(mode){
  err('');
  const f = $('file').files[0];
  if(!f){ err('Pilih file terlebih dahulu.'); return; }
  const fd = keyForm(mode); fd.append('file', f);
  const res = await fetch('/api/file', {method:'POST', body:fd});
  if(!res.ok){ err((await res.json()).error); return; }
  const cd = res.headers.get('Content-Disposition') || '';
  const m = cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await res.blob());
  a.download = m ? decodeURIComponent(m[1]) : 'hasil.dat';
  a.click();
}
</script>
</body>
</html>
